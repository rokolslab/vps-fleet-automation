name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned validation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run YAML lint
        run: yamllint .github ansible collections config

      - name: Run Ansible lint
        run: ansible-lint --profile basic ansible/playbooks/*.yml

      - name: Run Ansible syntax checks
        run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventories/production.example.yml --syntax-check "$playbook"
          done
