name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python and Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ansible-core
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Ansible syntax checks
        run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventories/production.example.yml --syntax-check "$playbook"
          done
