---
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apply SSH hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ baseline_ufw_default_incoming }}"

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ baseline_ufw_default_outgoing }}"

- name: Allow target SSH port
  community.general.ufw:
    rule: allow
    port: "{{ baseline_ssh_target_port }}"
    proto: tcp

- name: Manage legacy SSH port during migration
  community.general.ufw:
    rule: allow
    port: "{{ baseline_ssh_current_port }}"
    proto: tcp
    delete: "{{ not (baseline_keep_ssh_port_22 | bool) }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Apply fail2ban and unattended-upgrades policy
  ansible.builtin.import_tasks: security.yml

- name: Apply managed swap configuration
  ansible.builtin.import_tasks: swap.yml
  when: baseline_swap_enabled | bool
