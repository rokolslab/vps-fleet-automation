---
- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd-vps-baseline.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
  when: baseline_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: baseline_fail2ban_enabled | bool

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when: baseline_unattended_upgrades_enabled | bool

- name: Ensure unattended-upgrades is enabled
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
  when: baseline_unattended_upgrades_enabled | bool
