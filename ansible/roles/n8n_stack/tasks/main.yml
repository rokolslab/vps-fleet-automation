---
- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create n8n stack directory
  ansible.builtin.file:
    path: "{{ n8n_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Check whether protected environment already exists
  ansible.builtin.stat:
    path: "{{ n8n_stack_dir }}/.env"
  register: n8n_env_file

- name: Check whether persistent n8n database volume already exists
  ansible.builtin.command: docker volume inspect n8n_postgres_data
  register: n8n_existing_db_volume
  changed_when: false
  failed_when: false
  check_mode: false

- name: Guard | Refuse secret regeneration for existing data
  ansible.builtin.assert:
    that:
      - n8n_env_file.stat.exists or n8n_existing_db_volume.rc != 0
    fail_msg: >-
      Persistent n8n database data exists but the protected .env file is missing.
      Restore the original secrets before continuing; automatic secret rotation is refused.

- name: Generate initial stack secrets
  ansible.builtin.set_fact:
    n8n_generated_postgres_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters','digits']) }}"
    n8n_generated_encryption_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters','digits']) }}"
  no_log: true
  when: not n8n_env_file.stat.exists

- name: Write protected environment file once
  ansible.builtin.copy:
    dest: "{{ n8n_stack_dir }}/.env"
    owner: root
    group: root
    mode: '0600'
    content: |
      POSTGRES_PASSWORD={{ n8n_generated_postgres_password }}
      N8N_ENCRYPTION_KEY={{ n8n_generated_encryption_key }}
  no_log: true
  when: not n8n_env_file.stat.exists

- name: Render Docker Compose stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ n8n_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0640'

- name: Apply n8n Docker Compose stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ n8n_stack_dir }}"
  register: n8n_compose_up
  changed_when: >-
    'Created' in (n8n_compose_up.stdout ~ n8n_compose_up.stderr) or
    'Started' in (n8n_compose_up.stdout ~ n8n_compose_up.stderr) or
    'Recreated' in (n8n_compose_up.stdout ~ n8n_compose_up.stderr)

- name: Show planned loopback listener in check mode
  ansible.builtin.debug:
    msg: "n8n will bind to {{ n8n_bind_host }}:{{ n8n_bind_port }}"
  when: ansible_check_mode

- name: Wait for loopback n8n port after apply
  ansible.builtin.wait_for:
    host: "{{ n8n_bind_host }}"
    port: "{{ n8n_bind_port }}"
    timeout: 60
  when: not ansible_check_mode
